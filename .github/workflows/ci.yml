name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test (library, catalog contract, wasm exports)
        run: cargo test --workspace --locked
      - name: the library alone, each feature on its own (workspace unification hides gaps)
        run: |
          cargo build -p twolab-tui --locked
          cargo build -p twolab-tui --locked --features crossterm
          cargo build -p twolab-tui --locked --features catalog
      - name: wasm build (the catalog renderer)
        run: cargo build -p twolab-tui-catalog-wasm --target wasm32-unknown-unknown --profile wasm --locked

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - name: build (wasm + site)
        run: npm run build:site
      - name: test (painter + every demo through the real wasm module)
        run: npm test
