[package]
name = "tui-catalog"
description = "The twolab-tui catalog in your terminal: every widget's demos, live"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tui-catalog"
path = "src/main.rs"

[dependencies]
twolab-tui = { path = "../twolab-tui", features = ["catalog", "crossterm"] }
ratatui = { version = "0.30.1", features = ["crossterm"] }
crossterm = "0.29"
